# Next.js on Netlify: keep Sparticuz Chromium unpackaged so the Lambda runtime can load the binary.
# https://github.com/Sparticuz/chromium
#
# puppeteer is still referenced for optional local Chrome resolution + legacy scorecard routes;
# skip browser download during npm ci (procurement PDF uses puppeteer-core + @sparticuz/chromium on Netlify).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  PUPPETEER_SKIP_DOWNLOAD = "true"

# Declared explicitly: auto-detection did not install the runtime on the staging
# site, which published a bare .next directory with no SSR handler.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  external_node_modules = ["@sparticuz/chromium", "puppeteer-core"]

# Branch deploys and deploy previews: refuse to build against the production
# database, and build sign-in links from the deploy's own address. Only the
# production context (main) uses the values set for production. See
# docs/PRODUCTION_UPGRADE.md, "A separate Netlify staging site".
[context.deploy-preview]
  command = "node scripts/ops/check-deploy-context.mjs && NEXT_PUBLIC_SITE_URL=$DEPLOY_PRIME_URL npm run build"

[context.branch-deploy]
  command = "node scripts/ops/check-deploy-context.mjs && NEXT_PUBLIC_SITE_URL=$DEPLOY_PRIME_URL npm run build"
